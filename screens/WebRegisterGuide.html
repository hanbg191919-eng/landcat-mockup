<!doctype html><html><head><meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; font-family: 'Gothic A1', 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #12243D; text-decoration: none; }
    a:hover { color: #0B1930; }
  </style>
<style>html,body{margin:0;padding:0;background:#fff}</style></head><body><div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #FFFFFF;">

  <!-- 뒤에 깔린 지도 홈. 오버레이로 덮이므로 형태만 남긴다 -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 64px; background: #12243D;"></div>
  <div style="position: absolute; left: 0; top: 64px; bottom: 0; width: 372px; background: #FFFFFF; border-right: 1px solid #EEF0F2;"></div>
  <div style="position: absolute; left: 372px; right: 384px; top: 64px; bottom: 0; background: #E8EBED; overflow: hidden;">
    <svg width="684" height="836" viewBox="0 0 684 836" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
      <rect width="684" height="836" fill="#E8EBED"/>
      <rect x="24" y="24" width="196" height="150" fill="#DDE1E4"/>
      <rect x="258" y="-10" width="210" height="184" fill="#DDE1E4"/>
      <rect x="504" y="24" width="196" height="150" fill="#DDE1E4"/>
      <rect x="24" y="222" width="196" height="188" fill="#DDE1E4"/>
      <rect x="504" y="222" width="196" height="188" fill="#DDE1E4"/>
      <rect x="24" y="458" width="196" height="164" fill="#DDE1E4"/>
      <rect x="258" y="458" width="210" height="120" fill="#DDE1E4"/>
      <rect x="504" y="458" width="196" height="164" fill="#DDE1E4"/>
      <rect x="258" y="626" width="210" height="194" fill="#DDE1E4"/>
      <g stroke="#FFFFFF" stroke-linecap="butt">
        <path d="M0 198h684" stroke-width="24"/>
        <path d="M0 434h684" stroke-width="14"/>
        <path d="M0 646h684" stroke-width="12"/>
        <path d="M240 0v836" stroke-width="20"/>
        <path d="M486 0v836" stroke-width="14"/>
      </g>
    </svg>
  </div>
  <div style="position: absolute; right: 0; top: 64px; bottom: 0; width: 384px; background: #FFFFFF; border-left: 1px solid #EEF0F2;"></div>

  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(18, 36, 61, 0.60);"></div>

  <!-- 등록 안내 모달. 실측 높이 728px이라 (900-728)/2 = 86 -->
  <div style="position: absolute; left: 440px; top: 86px; width: 560px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 8px 32px rgba(11, 25, 48, 0.24); overflow: hidden;">

    <div style="height: 60px; display: flex; align-items: center; padding: 0 12px 0 24px; border-bottom: 1px solid #EEF0F2;">
      <span style="flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #1A1D21;">고양이 등록</span>
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    </div>

    <div style="padding: 28px 24px 24px;">
      <div style="width: 52px; height: 52px; border-radius: 8px; background: #FFC800; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#12243D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.4h3.2l1.4-2.2h6.8l1.4 2.2H20v10.2H4z"/><circle cx="12" cy="13.2" r="3.2"/></svg>
      </div>

      <span style="display: block; margin-top: 18px; font-size: 26px; font-weight: 800; letter-spacing: -0.6px; line-height: 32px; color: #1A1D21;">등록은 앱에서 할 수 있어요</span>
      <span style="display: block; margin-top: 10px; font-size: 14px; font-weight: 400; line-height: 22px; color: #6E7781;">랜드캣은 카메라로 그 자리에서 찍은 사진만 등록을 받아요. 앨범에서 아무 사진이나 올릴 수 있으면 목격 기록을 믿을 수 없기 때문이에요.</span>

      <div style="height: 1px; background: #EEF0F2; margin: 24px 0;"></div>

      <span style="display: block; margin-bottom: 14px; font-size: 14px; font-weight: 700; color: #1A1D21;">웹에서는 이런 걸 할 수 있어요</span>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: #F7F8F9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12243D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5"/><path d="M15 6.5V20"/></svg>
          </div>
          <div style="flex: 1; min-width: 0; padding-top: 5px;">
            <span style="font-size: 14px; font-weight: 700; line-height: 18px; color: #1A1D21;">지도에서 랜드마크 둘러보기</span>
            <span style="display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: #6E7781;">동네에 등록된 고양이와 목격 기록을 지도로 봐요</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: #F7F8F9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12243D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.4 4.7 13.1a4.9 4.9 0 0 1 6.9-6.9l.4.4.4-.4a4.9 4.9 0 0 1 6.9 6.9z"/></svg>
          </div>
          <div style="flex: 1; min-width: 0; padding-top: 5px;">
            <span style="font-size: 14px; font-weight: 700; line-height: 18px; color: #1A1D21;">좋아요 누르기</span>
            <span style="display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: #6E7781;">마음에 드는 고양이 프로필에 좋아요를 남겨요</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: #F7F8F9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12243D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.6h16v10.2H9.6L4 20.4z"/><path d="M8 9.4h8"/><path d="M8 12.4h5"/></svg>
          </div>
          <div style="flex: 1; min-width: 0; padding-top: 5px;">
            <span style="font-size: 14px; font-weight: 700; line-height: 18px; color: #1A1D21;">댓글과 커뮤니티 글쓰기</span>
            <span style="display: block; margin-top: 2px; font-size: 13px; line-height: 18px; color: #6E7781;">목격 소식을 남기고 동네 이웃과 이야기해요</span>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 16px; margin-top: 24px; padding: 16px; border-radius: 8px; background: #F7F8F9;">
        <div style="width: 88px; height: 88px; border-radius: 8px; background: #DDE1E4; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <span style="font-size: 11px; line-height: 15px; text-align: center; color: #6E7781;">앱 설치<br>QR 자리</span>
        </div>
        <div style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 14px; font-weight: 700; line-height: 18px; color: #1A1D21;">휴대폰으로 찍어서 설치</span>
          <span style="display: block; margin-top: 4px; font-size: 13px; line-height: 18px; color: #6E7781;">이미 앱이 있으면 아래 버튼으로 바로 열려요.</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 24px 24px;">
      <div style="flex: 1; height: 48px; border-radius: 8px; background: #12243D; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 700; color: #FFFFFF;">앱에서 열기</span>
      </div>
      <div style="height: 48px; padding: 0 20px; border-radius: 8px; border: 1px solid #EEF0F2; display: flex; align-items: center; flex-shrink: 0;">
        <span style="font-size: 15px; font-weight: 600; color: #1A1D21;">앱 설치 안내</span>
      </div>
    </div>
  </div>
</div></body></html>
