<!doctype html><html><head><meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; font-family: 'Gothic A1', 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #12243D; text-decoration: none; }
    a:hover { color: #0B1930; }
  </style>
<style>html,body{margin:0;padding:0;background:#fff}</style></head><body><div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF;">

  <!-- 상단 44px는 기기 상태바 자리라 비워 둔다 -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 44px; background: #FFFFFF;"></div>

  <!-- 세부 화면 상단바 56px: 뒤로가기 / 제목 / 단계 표시 -->
  <div style="position: absolute; left: 0; right: 0; top: 44px; height: 56px; background: #FFFFFF; border-bottom: 1px solid #EEF0F2; display: flex; align-items: center; padding: 0 8px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1D21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5L8 12l6.5 7"></path></svg>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #1A1D21;">등록 정보</span>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #6E7781;">2/2</span>
    </div>
  </div>

  <!-- 본문: 좌우 여백 20px, 섹션은 flex + gap으로만 띄운다 -->
  <div style="position: absolute; left: 0; right: 0; top: 100px; bottom: 88px; padding: 20px 20px 0; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 20px;">

      <!-- 방금 찍은 사진 확인: 썸네일 + 설명 + 다시 촬영을 한 줄에 눕혀 카드 높이를 104px로 묶었다 -->
      <div style="border: 1px solid #EEF0F2; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 80px; height: 80px; border-radius: 8px; background: #DDE1E4; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA1A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.8 10.4V4.6l4.6 3.2"></path>
            <path d="M19.2 10.4V4.6l-4.6 3.2"></path>
            <path d="M4.8 10.4c0-2.1 3.2-3.6 7.2-3.6s7.2 1.5 7.2 3.6v2.8c0 4-3.2 6.9-7.2 6.9s-7.2-2.9-7.2-6.9z"></path>
            <path d="M9.4 12.4v.9"></path>
            <path d="M14.6 12.4v.9"></path>
            <path d="M10.9 15.6c.6.7 1.6.7 2.2 0"></path>
            <path d="M1.8 12.9h2.6"></path>
            <path d="M2.3 15.6l2.2-.7"></path>
            <path d="M22.2 12.9h-2.6"></path>
            <path d="M21.7 15.6l-2.2-.7"></path>
          </svg>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.2px; color: #1A1D21;">방금 촬영한 사진</span>
          <span style="font-size: 13px; font-weight: 400; color: #6E7781;">오늘 오후 7:31</span>
        </div>
        <div style="height: 44px; padding: 0 14px; border: 1px solid #EEF0F2; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; flex-shrink: 0;">
          <span style="font-size: 13px; font-weight: 700; color: #12243D;">다시 촬영</span>
        </div>
      </div>

      <!-- 이름: 이미 채워진 값 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 13px; font-weight: 700; color: #1A1D21;">이름</span>
        </div>
        <div style="height: 48px; border: 1px solid #EEF0F2; border-radius: 8px; background: #F7F8F9; padding: 0 14px; display: flex; align-items: center;">
          <span style="font-size: 15px; font-weight: 500; color: #1A1D21;">치즈</span>
        </div>
      </div>

      <!-- 특징: 앞 2개는 선택 상태(남색), 칩 높이 44px로 터치 영역 확보 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 13px; font-weight: 700; color: #1A1D21;">특징</span>
          <span style="font-size: 12px; font-weight: 400; color: #9AA1A9;">최대 3개</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <div style="height: 44px; padding: 0 14px; border-radius: 8px; background: #12243D; display: flex; align-items: center;">
            <span style="font-size: 14px; font-weight: 600; color: #FFFFFF;">치즈태비</span>
          </div>
          <div style="height: 44px; padding: 0 14px; border-radius: 8px; background: #12243D; display: flex; align-items: center;">
            <span style="font-size: 14px; font-weight: 600; color: #FFFFFF;">사람을 잘 따름</span>
          </div>
          <div style="height: 44px; padding: 0 14px; border: 1px solid #EEF0F2; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center;">
            <span style="font-size: 14px; font-weight: 400; color: #1A1D21;">겁이 많음</span>
          </div>
          <div style="height: 44px; padding: 0 14px; border: 1px solid #EEF0F2; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center;">
            <span style="font-size: 14px; font-weight: 400; color: #1A1D21;">아기 고양이</span>
          </div>
          <div style="height: 44px; padding: 0 14px; border: 1px solid #EEF0F2; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center;">
            <span style="font-size: 14px; font-weight: 400; color: #1A1D21;">TNR 완료</span>
          </div>
          <div style="height: 44px; padding: 0 14px; border: 1px solid #EEF0F2; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; gap: 6px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6E7781" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
            <span style="font-size: 14px; font-weight: 400; color: #6E7781;">직접 입력</span>
          </div>
        </div>
      </div>

      <!-- 위치 확인: 낮은 지도 + 번호판, 아래 줄에 사람이 읽는 장소 이름과 조정 버튼 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 13px; font-weight: 700; color: #1A1D21;">위치</span>
          <span style="font-size: 12px; font-weight: 400; color: #9AA1A9;">촬영한 자리로 잡았어요</span>
        </div>
        <div style="border: 1px solid #EEF0F2; border-radius: 8px; overflow: hidden;">
          <div style="height: 80px; position: relative; overflow: hidden; background: #E8EBED;">
            <svg width="350" height="80" viewBox="0 0 350 80" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
              <rect width="350" height="80" fill="#E8EBED"></rect>
              <rect x="14" y="6" width="86" height="26" rx="2" fill="#DDE1E4"></rect>
              <rect x="112" y="2" width="58" height="22" rx="2" fill="#DDE1E4"></rect>
              <rect x="238" y="8" width="96" height="24" rx="2" fill="#DDE1E4"></rect>
              <rect x="22" y="56" width="72" height="24" rx="2" fill="#DDE1E4"></rect>
              <rect x="214" y="54" width="112" height="26" rx="2" fill="#DDE1E4"></rect>
              <path d="M0 44h350" stroke="#FFFFFF" stroke-width="14"></path>
              <path d="M186 0v80" stroke="#FFFFFF" stroke-width="10"></path>
            </svg>
            <div style="position: absolute; top: 22px; left: 166px; width: 40px; height: 36px; border-radius: 4px; background: #FFC800; display: flex; align-items: center; justify-content: center;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #12243D;">12</span>
            </div>
          </div>
          <div style="height: 60px; border-top: 1px solid #EEF0F2; padding: 0 12px; display: flex; align-items: center; gap: 12px;">
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.2px; color: #1A1D21;">돌담길 화단</span>
              <span style="font-size: 13px; font-weight: 400; color: #6E7781;">서울 성북구 동선동1가</span>
            </div>
            <div style="height: 44px; padding: 0 16px; border: 1px solid #EEF0F2; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; flex-shrink: 0;">
              <span style="font-size: 13px; font-weight: 700; color: #12243D;">조정</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 안내: 부수 정보라 회색 바닥에 작게, 두 줄로 끝낸다 -->
      <div style="background: #F7F8F9; border-radius: 8px; padding: 12px 14px; display: flex; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7781" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5"></path>
          <path d="M12 7.6v.8"></path>
        </svg>
        <p style="margin: 0; font-size: 13px; font-weight: 400; line-height: 1.5; color: #6E7781;">사람 얼굴이나 집 주소가 보이는 사진은 공개하기 전에 가려 드려요.</p>
      </div>

    </div>
  </div>

  <!-- 하단 고정 주요 버튼: 시트 그림자만 허용 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #FFFFFF; border-top: 1px solid #EEF0F2; box-shadow: 0 -2px 12px rgba(18,36,61,0.08); padding: 12px 20px 24px;">
    <div style="height: 52px; border-radius: 8px; background: #12243D; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #FFFFFF;">등록하기</span>
    </div>
  </div>

</div></body></html>
